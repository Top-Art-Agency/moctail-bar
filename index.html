<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Moctail bar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Figtree:wght@400;500;700&family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Archivo:wght@400;600&family=Archivo+Narrow:wght@700&family=JetBrains+Mono:wght@500;700&family=Bebas+Neue&family=Pacifico&family=Playfair+Display:ital,wght@1,800&family=Fredoka:wght@700&display=swap">
<link rel="stylesheet" id="css" href="guest.css">
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js" defer></script>
</head>
<body>
<div id="root"></div>
<script src="firebase-config.js"></script>
<script type="module">
/* Jeden adres dla wszystkich:
   gość (np. z kodu QR) widzi menu i zamawia,
   obsługa przechodzi do „Obsługa baru” (#obsluga) i po zalogowaniu ma panel. */
import { configured, auth, au } from './fb.js';
const root = document.getElementById('root');
const QS = new URLSearchParams(location.search);
let mode = null;
async function go(m, user){
  if (m === mode) return;
  if (mode) { location.reload(); return; }
  mode = m;
  document.getElementById('css').href = m + '.css';
  const mod = await import('./' + m + '.js');
  mod.mount(root, user);
}
if (!configured) {
  root.innerHTML = '<div class="wrap"><header><h1>Moctail bar</h1></header><div class="closed-box">Strona nie jest jeszcze połączona z bazą. Obsługa: uzupełnij plik firebase-config.js.</div></div>';
} else {
  au.onAuthStateChanged(auth, user => {
    const staff = !QS.has('gosc') && (user || location.hash === '#obsluga');
    go(staff ? 'staff' : 'guest', user);
  });
  window.addEventListener('hashchange', () => { if (location.hash === '#obsluga' && mode === 'guest') location.reload(); });
}
</script>
</body>
</html>
